name: wf-ci
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
  push:
    branches:
      - develop
jobs:
  linting-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4  
      - name: Install dependencies
        run: npm ci   # Use `npm ci` for clean install in CI environment
      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"
      - name: Lint CSS Files 
        run: npx stylelint "**/*.css"
      - name: Build Website With Parcel
        run: npx parcel build src/index.html --dist-dir dist
